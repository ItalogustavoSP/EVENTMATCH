<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vie Casamentos - Tema Escuro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0a0a;
            min-height: 100vh;
        }
        
        /* Header com fundo escuro e borda dourada */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-bottom: 2px solid #ffd700;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .logo { 
            font-size: 1.8rem; 
            font-weight: bold; 
            cursor: pointer;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        
        .user-info { display: flex; align-items: center; gap: 1rem; }
        
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid #ffd700;
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .btn-logout {
            background: rgba(255,215,0,0.2);
            border: 1px solid #ffd700;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: rgba(255,215,0,0.4);
            transform: translateY(-2px);
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        
        /* Tabs com estilo dourado */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #ccc;
        }
        .tab:hover {
            border-color: #ffd700;
            color: #ffd700;
        }
        .tab.active {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #1a1a1a;
            border-color: #ffd700;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Cards com fundo escuro e borda dourada */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid #333;
            transition: all 0.3s;
            cursor: pointer;
        }
        .stat-card:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,215,0,0.1);
        }
        .stat-card h3 { color: #ffd700; font-size: 0.8rem; }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #fff; }
        
        .budget-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .budget-card {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid #333;
            transition: all 0.3s;
        }
        .budget-card:hover {
            border-color: #ffd700;
        }
        .budget-card.used { border-left: 4px solid #ffd700; }
        .budget-card.available { border-left: 4px solid #10b981; }
        .budget-value { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .budget-card.used .budget-value { color: #ffd700; }
        .budget-card.available .budget-value { color: #10b981; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .chart-card {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #333;
        }
        .chart-card h3 { margin-bottom: 0.5rem; font-size: 1rem; color: #ffd700; }
        .chart-container { height: 200px; }
        
        .progress-section {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }
        .progress-section h3 { color: #ffd700; }
        .progress-bar {
            background: #333;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .progress-fill {
            background: linear-gradient(90deg, #ffd700, #ffb347);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            color: #1a1a1a;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        /* Checklist */
        .checklist-section {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }
        .checklist-header h2 { color: #ffd700; }
        .checklist-filters {
            display: flex;
            gap: 0.5rem;
        }
        .filter-btn {
            padding: 0.25rem 0.75rem;
            border: 1px solid #ffd700;
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #ffd700;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #ffd700;
            color: #1a1a1a;
        }
        .filter-btn:hover {
            background: #ffd700;
            color: #1a1a1a;
        }
        .checklist-category {
            margin-bottom: 1.5rem;
        }
        .category-title {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.5rem;
            background: #252525;
            border-left: 3px solid #ffd700;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            color: #ffd700;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: #252525;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            border: 1px solid #333;
        }
        .task-item:hover { 
            background: #2a2a2a;
            border-color: #ffd700;
        }
        .task-check {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: #ffd700;
        }
        .task-check:checked + .task-content .task-name {
            text-decoration: line-through;
            color: #666;
        }
        .task-content { flex: 1; }
        .task-name { font-weight: 600; color: #fff; }
        .task-due-date { font-size: 0.7rem; color: #888; margin-top: 0.25rem; }
        .priority-alta { background: #ff4444; color: #fff; }
        .priority-media { background: #ffd700; color: #1a1a1a; }
        .priority-baixa { background: #10b981; color: #fff; }
        .task-priority {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 0.5rem;
        }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
            color: #ffd700;
        }
        
        /* Calendário */
        .calendar-section {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }
        .calendar-header h3 { color: #ffd700; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.25rem;
        }
        .calendar-weekday { color: #ffd700; text-align: center; font-weight: bold; padding: 0.5rem; }
        .calendar-day {
            text-align: center;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            background: #252525;
            color: #fff;
            transition: all 0.3s;
        }
        .calendar-day:hover {
            background: #333;
            transform: scale(1.05);
        }
        .calendar-day.has-event { 
            background: #ffd700;
            color: #1a1a1a;
            font-weight: bold;
        }
        
        /* Eventos */
        .section-header h2 { color: #ffd700; }
        .section-header {
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
        }
        .btn {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #1a1a1a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        }
        .btn-secondary {
            background: #252525;
            border: 1px solid #ffd700;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            color: #ffd700;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: #ffd700;
            color: #1a1a1a;
        }
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .event-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.3s;
        }
        .event-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 10px 20px rgba(255,215,0,0.1);
        }
        .event-card.selected { 
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        .event-card-header {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #1a1a1a;
            padding: 0.75rem;
        }
        .event-card-body { padding: 0.75rem; }
        .event-card-body p { font-size: 0.8rem; margin: 0.25rem 0; color: #ccc; }
        .event-card-body p strong { color: #ffd700; }
        
        /* Listas */
        .guest-list, .supplier-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.5rem;
        }
        .guest-card, .supplier-card {
            background: #252525;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            border: 1px solid #333;
            color: #fff;
        }
        .guest-card strong, .supplier-card strong { color: #ffd700; }
        .empty-state { 
            text-align: center; 
            padding: 2rem; 
            background: #1a1a1a; 
            border-radius: 1rem; 
            color: #888;
            border: 1px solid #333;
        }
        
        /* Perfil */
        .profile-section {
            background: #1a1a1a;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .profile-avatar-large {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #1a1a1a;
            margin-bottom: 1rem;
            overflow: hidden;
            border: 3px solid #ffd700;
        }
        .profile-info h2 { color: #ffd700; }
        .profile-info p { color: #888; }
        .form-group label { color: #ffd700; }
        .form-group input, .form-group select {
            background: #252525;
            border: 1px solid #333;
            color: #fff;
        }
        .form-group input:focus {
            border-color: #ffd700;
            outline: none;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #ffd700;
        }
        .modal-content h2 { color: #ffd700; margin-bottom: 1rem; }
        
        /* Login */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        }
        .auth-box {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 350px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.1);
        }
        .auth-box h1 { 
            text-align: center; 
            margin-bottom: 1rem; 
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #333;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #888;
        }
        .auth-tab.active { color: #ffd700; border-bottom: 2px solid #ffd700; }
        .error-message { background: rgba(220,38,38,0.2); color: #ef4444; padding: 0.5rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; border: 1px solid #ef4444; }
        .success-message { background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid #10b981; }
        
        @media (max-width: 768px) {
            .stats-grid, .charts-grid, .budget-grid, .profile-form-grid {
                grid-template-columns: 1fr;
            }
            .container { padding: 1rem; }
            .profile-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================
        // BANCO DE DADOS LOCAL (MESMO CÓDIGO ANTERIOR)
        // ============================================
        
        let USUARIOS = JSON.parse(localStorage.getItem('usuarios')) || {};
        let globalEvents = JSON.parse(localStorage.getItem('globalEvents')) || [];
        let globalGuests = JSON.parse(localStorage.getItem('globalGuests')) || [];
        let globalSuppliers = JSON.parse(localStorage.getItem('globalSuppliers')) || [];
        let globalTasks = JSON.parse(localStorage.getItem('globalTasks')) || [];
        let nextIds = JSON.parse(localStorage.getItem('nextIds')) || { event: 1, guest: 1, supplier: 1, task: 1 };

        // Criar admin automaticamente
        if (!USUARIOS['admin']) {
            USUARIOS['admin'] = {
                id: 1,
                username: 'admin',
                password: 'admin123',
                email: 'admin@lavie.com',
                is_admin: true,
                profile: {
                    fullName: 'Administrador',
                    cpf: '000.000.000-00',
                    birthDate: '1990-01-01',
                    address: 'Rua Administrativa, 123',
                    phone: '(11) 99999-9999',
                    photo: null
                }
            };
            localStorage.setItem('usuarios', JSON.stringify(USUARIOS));
        }

        // Criar tarefas padrão se não existirem
        if (globalTasks.length === 0) {
            const tarefasPadrao = [
                { name: "Definir orçamento do casamento", category: "12 meses", priority: "alta" },
                { name: "Escolher a data do casamento", category: "12 meses", priority: "alta" },
                { name: "Pesquisar e reservar o espaço", category: "12 meses", priority: "alta" },
                { name: "Contratar buffet", category: "9 meses", priority: "alta" },
                { name: "Escolher o vestido de noiva", category: "9 meses", priority: "alta" },
                { name: "Contratar fotógrafo e videografista", category: "6 meses", priority: "alta" },
                { name: "Contratar música/DJ", category: "6 meses", priority: "media" },
                { name: "Enviar os convites", category: "3 meses", priority: "alta" },
                { name: "Confirmar fornecedores", category: "3 meses", priority: "alta" },
                { name: "Confirmar lista de convidados final", category: "1 mês", priority: "alta" },
                { name: "Relaxar e aproveitar o grande dia!", category: "Dia do Casamento", priority: "alta" }
            ];
            
            tarefasPadrao.forEach((task, index) => {
                globalTasks.push({
                    id: nextIds.task++,
                    event_id: null,
                    ...task,
                    completed: false,
                    due_date: "",
                    created_at: new Date().toISOString()
                });
            });
            localStorage.setItem('globalTasks', JSON.stringify(globalTasks));
        }

        // Estado
        let state = {
            user: null,
            events: [],
            guests: [],
            suppliers: [],
            tasks: [],
            selectedEvent: null,
            showEventForm: false,
            showGuestForm: false,
            showSupplierForm: false,
            showTaskForm: false,
            editingEvent: null,
            editingGuest: null,
            editingSupplier: null,
            editingTask: null,
            authMode: 'login',
            activeTab: 'dashboard',
            taskFilter: 'all',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            charts: {}
        };

        function salvarDados() {
            localStorage.setItem('usuarios', JSON.stringify(USUARIOS));
            localStorage.setItem('globalEvents', JSON.stringify(globalEvents));
            localStorage.setItem('globalGuests', JSON.stringify(globalGuests));
            localStorage.setItem('globalSuppliers', JSON.stringify(globalSuppliers));
            localStorage.setItem('globalTasks', JSON.stringify(globalTasks));
            localStorage.setItem('nextIds', JSON.stringify(nextIds));
        }

        // ============================================
        // FUNÇÕES DE AUTENTICAÇÃO
        // ============================================
        
        function register(username, password, email) {
            if (USUARIOS[username]) return { success: false, error: 'Usuário já existe!' };
            const emailExistente = Object.values(USUARIOS).some(u => u.email === email);
            if (emailExistente) return { success: false, error: 'Email já cadastrado!' };
            
            USUARIOS[username] = {
                id: Object.keys(USUARIOS).length + 1,
                username, password, email,
                is_admin: false,
                profile: {
                    fullName: '',
                    cpf: '',
                    birthDate: '',
                    address: '',
                    phone: '',
                    photo: null
                }
            };
            salvarDados();
            return { success: true };
        }
        
        function login(username, password) {
            const user = USUARIOS[username];
            if (user && user.password === password) {
                state.user = { ...user };
                state.events = globalEvents.filter(e => e.user_id === user.id);
                state.tasks = globalTasks.filter(t => !t.event_id || t.event_id === null);
                state.selectedEvent = null;
                state.guests = [];
                state.suppliers = [];
                state.activeTab = 'dashboard';
                return true;
            }
            return false;
        }
        
        function logout() {
            state.user = null;
            state.events = [];
            state.selectedEvent = null;
            state.guests = [];
            state.suppliers = [];
            state.tasks = [];
            Object.values(state.charts).forEach(c => c?.destroy());
            renderAuth();
        }
        
        // ============================================
        // FUNÇÕES DE PERFIL
        // ============================================
        
        function updateProfile(profileData) {
            if (state.user) {
                USUARIOS[state.user.username].profile = { ...USUARIOS[state.user.username].profile, ...profileData };
                state.user.profile = { ...state.user.profile, ...profileData };
                salvarDados();
                renderDashboard();
                showNotification('Perfil atualizado com sucesso!', 'success');
                return true;
            }
            return false;
        }
        
        function updateProfilePhoto(photoBase64) {
            if (state.user) {
                USUARIOS[state.user.username].profile.photo = photoBase64;
                state.user.profile.photo = photoBase64;
                salvarDados();
                renderDashboard();
                showNotification('Foto de perfil atualizada!', 'success');
                return true;
            }
            return false;
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.bottom = '20px';
            notification.style.right = '20px';
            notification.style.padding = '1rem';
            notification.style.borderRadius = '8px';
            notification.style.backgroundColor = type === 'success' ? '#10b981' : '#e11d48';
            notification.style.color = 'white';
            notification.style.zIndex = '2000';
            notification.style.boxShadow = '0 4px 6px rgba(0,0,0,0.3)';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }
        
        // ============================================
        // CRUD EVENTOS
        // ============================================
        
        function createEvent(data) {
            const newEvent = { id: nextIds.event++, user_id: state.user.id, ...data };
            globalEvents.push(newEvent);
            state.events.push(newEvent);
            salvarDados();
            return true;
        }
        
        function updateEvent(id, data) {
            const index = globalEvents.findIndex(e => e.id === id);
            if (index !== -1) {
                globalEvents[index] = { ...globalEvents[index], ...data };
                const ui = state.events.findIndex(e => e.id === id);
                if (ui !== -1) state.events[ui] = { ...state.events[ui], ...data };
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteEvent(id) {
            globalEvents = globalEvents.filter(e => e.id !== id);
            state.events = state.events.filter(e => e.id !== id);
            globalGuests = globalGuests.filter(g => g.event_id !== id);
            globalSuppliers = globalSuppliers.filter(s => s.event_id !== id);
            globalTasks = globalTasks.filter(t => t.event_id !== id);
            if (state.selectedEvent === id) {
                state.selectedEvent = null;
                state.guests = [];
                state.suppliers = [];
                state.tasks = globalTasks.filter(t => !t.event_id);
            }
            salvarDados();
            return true;
        }
        
        // ============================================
        // CRUD CONVIDADOS
        // ============================================
        
        function createGuest(data) {
            const newGuest = { id: nextIds.guest++, ...data };
            globalGuests.push(newGuest);
            if (newGuest.event_id === state.selectedEvent) state.guests.push(newGuest);
            salvarDados();
            return true;
        }
        
        function updateGuest(id, data) {
            const index = globalGuests.findIndex(g => g.id === id);
            if (index !== -1) {
                globalGuests[index] = { ...globalGuests[index], ...data };
                const ui = state.guests.findIndex(g => g.id === id);
                if (ui !== -1) state.guests[ui] = { ...state.guests[ui], ...data };
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteGuest(id) {
            globalGuests = globalGuests.filter(g => g.id !== id);
            state.guests = state.guests.filter(g => g.id !== id);
            salvarDados();
            return true;
        }
        
        // ============================================
        // CRUD FORNECEDORES
        // ============================================
        
        function createSupplier(data) {
            const newSupplier = { id: nextIds.supplier++, ...data, created_at: new Date().toISOString() };
            globalSuppliers.push(newSupplier);
            if (newSupplier.event_id === state.selectedEvent) state.suppliers.push(newSupplier);
            salvarDados();
            return true;
        }
        
        function updateSupplier(id, data) {
            const index = globalSuppliers.findIndex(s => s.id === id);
            if (index !== -1) {
                globalSuppliers[index] = { ...globalSuppliers[index], ...data };
                const ui = state.suppliers.findIndex(s => s.id === id);
                if (ui !== -1) state.suppliers[ui] = { ...state.suppliers[ui], ...data };
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteSupplier(id) {
            globalSuppliers = globalSuppliers.filter(s => s.id !== id);
            state.suppliers = state.suppliers.filter(s => s.id !== id);
            salvarDados();
            return true;
        }
        
        // ============================================
        // CRUD TAREFAS
        // ============================================
        
        function createTask(data) {
            const newTask = { id: nextIds.task++, ...data, completed: false, created_at: new Date().toISOString() };
            globalTasks.push(newTask);
            state.tasks.push(newTask);
            salvarDados();
            return true;
        }
        
        function updateTask(id, data) {
            const index = globalTasks.findIndex(t => t.id === id);
            if (index !== -1) {
                globalTasks[index] = { ...globalTasks[index], ...data };
                const ui = state.tasks.findIndex(t => t.id === id);
                if (ui !== -1) state.tasks[ui] = { ...state.tasks[ui], ...data };
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteTask(id) {
            globalTasks = globalTasks.filter(t => t.id !== id);
            state.tasks = state.tasks.filter(t => t.id !== id);
            salvarDados();
            return true;
        }
        
        function toggleTaskComplete(id) {
            const task = globalTasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                const uiTask = state.tasks.find(t => t.id === id);
                if (uiTask) uiTask.completed = task.completed;
                salvarDados();
                renderDashboard();
            }
        }
        
        function loadEventData(id) {
            state.guests = globalGuests.filter(g => g.event_id === id);
            state.suppliers = globalSuppliers.filter(s => s.event_id === id);
            state.tasks = globalTasks.filter(t => t.event_id === id || !t.event_id);
        }
        
        // ============================================
        // UTILITÁRIOS
        // ============================================
        
        function formatCurrency(v) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
        }
        
        function formatDate(d) {
            if (!d) return '';
            return new Date(d).toLocaleDateString('pt-BR');
        }
        
        function getTotalGasto() {
            return state.suppliers.reduce((s, i) => s + (i.value || 0), 0);
        }
        
        function getGastosPorCategoria() {
            const cats = {};
            state.suppliers.forEach(s => {
                const cat = s.category || 'Outros';
                cats[cat] = (cats[cat] || 0) + (s.value || 0);
            });
            return cats;
        }
        
        function getStatusConvidados() {
            const status = { confirmado: 0, pendente: 0, recusado: 0 };
            state.guests.forEach(g => {
                if (g.status === 'confirmado') status.confirmado++;
                else if (g.status === 'recusado') status.recusado++;
                else status.pendente++;
            });
            return status;
        }
        
        function getProgressoChecklist() {
            const tarefasEvento = state.tasks;
            if (tarefasEvento.length === 0) return 0;
            const concluidas = tarefasEvento.filter(t => t.completed).length;
            return (concluidas / tarefasEvento.length) * 100;
        }
        
        // ============================================
        // GRÁFICOS
        // ============================================
        
        function criarGraficos() {
            if (!state.selectedEvent) return;
            
            const ctxBar = document.getElementById('graficoBarras')?.getContext('2d');
            const ctxPie = document.getElementById('graficoPizza')?.getContext('2d');
            
            if (ctxBar && state.charts.barras) state.charts.barras.destroy();
            if (ctxPie && state.charts.pizza) state.charts.pizza.destroy();
            
            const gastos = getGastosPorCategoria();
            if (ctxBar && Object.keys(gastos).length > 0) {
                state.charts.barras = new Chart(ctxBar, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(gastos),
                        datasets: [{ label: 'Gastos (R$)', data: Object.values(gastos), backgroundColor: '#ffd700' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
            
            const status = getStatusConvidados();
            if (ctxPie && state.guests.length > 0) {
                state.charts.pizza = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: [`Confirmados (${status.confirmado})`, `Pendentes (${status.pendente})`, `Recusados (${status.recusado})`],
                        datasets: [{ data: [status.confirmado, status.pendente, status.recusado], backgroundColor: ['#10b981', '#ffd700', '#ef4444'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        }
        
        // ============================================
        // RENDERIZAÇÃO
        // ============================================
        
        function renderPerfil() {
            const profile = state.user?.profile || {};
            const photoUrl = profile.photo || '';
            
            return `
                <div class="profile-section">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <div class="profile-avatar-large" id="profileAvatar">
                                ${photoUrl ? `<img src="${photoUrl}" alt="Foto de perfil">` : `<span>${state.user?.username?.charAt(0)?.toUpperCase() || 'U'}</span>`}
                            </div>
                            <input type="file" id="photoUpload" accept="image/*" style="display: none;">
                            <button class="btn-secondary" onclick="document.getElementById('photoUpload').click()">📷 Alterar Foto</button>
                        </div>
                        <div class="profile-info">
                            <h2>${profile.fullName || state.user?.username || 'Usuário'}</h2>
                            <p>${state.user?.email || ''}</p>
                            <p>Membro desde ${new Date().toLocaleDateString('pt-BR')}</p>
                        </div>
                    </div>
                    
                    <form id="profileForm">
                        <div class="profile-form-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                            <div class="form-group">
                                <label>Nome Completo</label>
                                <input type="text" name="fullName" value="${profile.fullName || ''}" placeholder="Seu nome completo">
                            </div>
                            <div class="form-group">
                                <label>CPF</label>
                                <input type="text" name="cpf" value="${profile.cpf || ''}" placeholder="000.000.000-00" maxlength="14">
                            </div>
                            <div class="form-group">
                                <label>Data de Nascimento</label>
                                <input type="date" name="birthDate" value="${profile.birthDate || ''}">
                            </div>
                            <div class="form-group">
                                <label>Telefone</label>
                                <input type="tel" name="phone" value="${profile.phone || ''}" placeholder="(11) 99999-9999">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Endereço</label>
                                <input type="text" name="address" value="${profile.address || ''}" placeholder="Rua, número, bairro, cidade">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" value="${state.user?.email || ''}" disabled style="background: #333;">
                            </div>
                        </div>
                        <div class="form-group" style="margin-top: 1rem;">
                            <button type="submit" class="btn">💾 Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            `;
        }
        
        function renderChecklist() {
            let filteredTasks = state.tasks;
            
            if (state.taskFilter === 'pending') {
                filteredTasks = filteredTasks.filter(t => !t.completed);
            } else if (state.taskFilter === 'completed') {
                filteredTasks = filteredTasks.filter(t => t.completed);
            }
            
            const categories = {};
            filteredTasks.forEach(task => {
                if (!categories[task.category]) categories[task.category] = [];
                categories[task.category].push(task);
            });
            
            const categoryOrder = ['12 meses', '9 meses', '6 meses', '3 meses', '1 mês', '1 semana', 'Dia do Casamento'];
            
            return `
                <div class="checklist-section">
                    <div class="checklist-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                        <h2>✅ Checklist do Casamento</h2>
                        <div class="checklist-filters">
                            <button class="filter-btn ${state.taskFilter === 'all' ? 'active' : ''}" onclick="setTaskFilter('all')">Todas</button>
                            <button class="filter-btn ${state.taskFilter === 'pending' ? 'active' : ''}" onclick="setTaskFilter('pending')">Pendentes</button>
                            <button class="filter-btn ${state.taskFilter === 'completed' ? 'active' : ''}" onclick="setTaskFilter('completed')">Concluídas</button>
                            <button class="btn" onclick="openTaskModal()">+ Nova Tarefa</button>
                        </div>
                    </div>
                    
                    <div class="progress-section" style="margin-bottom: 1rem;">
                        <h3>Progresso: ${getProgressoChecklist().toFixed(0)}% concluído</h3>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${getProgressoChecklist()}%">${getProgressoChecklist().toFixed(0)}%</div>
                        </div>
                    </div>
                    
                    ${categoryOrder.map(cat => {
                        const tasks = categories[cat] || [];
                        if (tasks.length === 0) return '';
                        const concluidas = tasks.filter(t => t.completed).length;
                        return `
                            <div class="checklist-category">
                                <div class="category-title">
                                    <span>📋 ${cat}</span>
                                    <span>${concluidas}/${tasks.length} concluídas</span>
                                </div>
                                ${tasks.map(task => `
                                    <div class="task-item">
                                        <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''} onchange="toggleTaskComplete(${task.id})">
                                        <div class="task-content">
                                            <div class="task-name">
                                                ${task.name}
                                                <span class="task-priority priority-${task.priority}">${task.priority === 'alta' ? '🔴 Alta' : task.priority === 'media' ? '🟡 Média' : '🟢 Baixa'}</span>
                                            </div>
                                            ${task.due_date ? `<div class="task-due-date">📅 Vence: ${formatDate(task.due_date)}</div>` : ''}
                                        </div>
                                        <div class="task-actions">
                                            <button class="btn-icon" onclick="editTask(${task.id})">✏️</button>
                                            <button class="btn-icon" onclick="deleteTaskConfirm(${task.id})">🗑️</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }).join('')}
                    
                    ${filteredTasks.length === 0 ? '<div class="empty-state">Nenhuma tarefa encontrada!</div>' : ''}
                </div>
            `;
        }
        
        function renderCalendario() {
            const primeiraSemana = new Date(state.calendarYear, state.calendarMonth, 1);
            const ultimoDia = new Date(state.calendarYear, state.calendarMonth + 1, 0);
            const diasNoMes = ultimoDia.getDate();
            const primeiroDiaSemana = primeiraSemana.getDay();
            const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            let dias = [];
            
            for (let i = 0; i < primeiroDiaSemana; i++) dias.push(null);
            
            for (let i = 1; i <= diasNoMes; i++) {
                const dataAtual = new Date(state.calendarYear, state.calendarMonth, i);
                const temEvento = state.events.some(event => {
                    const dataEvento = new Date(event.event_date);
                    return dataEvento.toDateString() === dataAtual.toDateString();
                });
                const isToday = dataAtual.toDateString() === new Date().toDateString();
                dias.push({ dia: i, temEvento, isToday, data: dataAtual });
            }
            
            return `
                <div class="calendar-section">
                    <div class="calendar-header" style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <h3>📅 ${primeiraSemana.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</h3>
                        <div><button class="btn-secondary" onclick="mudarMes(-1)">◀</button><button class="btn-secondary" onclick="mudarMes(1)">▶</button></div>
                    </div>
                    <div class="calendar-grid">
                        ${diasSemana.map(d => `<div class="calendar-weekday">${d}</div>`).join('')}
                        ${dias.map(dia => dia === null ? '<div class="calendar-day"></div>' : 
                            `<div class="calendar-day ${dia.temEvento ? 'has-event' : ''}" onclick="selecionarDataCalendario('${dia.data.toISOString()}')">${dia.dia}${dia.temEvento ? '🎉' : ''}</div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function renderDashboard() {
            const app = document.getElementById('app');
            const currentEvent = state.events.find(e => e.id === state.selectedEvent);
            const totalGasto = getTotalGasto();
            const orcamentoTotal = currentEvent?.budget_total || 0;
            const percentual = orcamentoTotal > 0 ? (totalGasto / orcamentoTotal) * 100 : 0;
            const statusConvidados = getStatusConvidados();
            const progressoChecklist = getProgressoChecklist();
            const profile = state.user?.profile || {};
            const photoUrl = profile.photo || '';
            
            let modalHtml = '';
            if (state.showEventForm) modalHtml = renderEventForm();
            if (state.showGuestForm) modalHtml = renderGuestForm();
            if (state.showSupplierForm) modalHtml = renderSupplierForm();
            if (state.showTaskForm) modalHtml = renderTaskForm();
            
            let calendarioHtml = renderCalendario();
            
            app.innerHTML = `
                <div class="header">
                    <div class="logo" onclick="setActiveTab('dashboard')">💍 La Vie Casamentos</div>
                    <div class="user-info">
                        <div class="profile-pic" onclick="setActiveTab('profile')">
                            ${photoUrl ? `<img src="${photoUrl}" alt="Perfil">` : `<span>${state.user?.username?.charAt(0)?.toUpperCase() || 'U'}</span>`}
                        </div>
                        <span style="color: #ffd700;">${state.user?.username}</span>
                        <button class="btn-logout" onclick="logout()">Sair</button>
                    </div>
                </div>
                
                <div class="container">
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab ${state.activeTab === 'dashboard' ? 'active' : ''}" onclick="setActiveTab('dashboard')">📊 Dashboard</button>
                        <button class="tab ${state.activeTab === 'checklist' ? 'active' : ''}" onclick="setActiveTab('checklist')">✅ Checklist</button>
                        <button class="tab ${state.activeTab === 'events' ? 'active' : ''}" onclick="setActiveTab('events')">🎯 Eventos</button>
                        <button class="tab ${state.activeTab === 'calendar' ? 'active' : ''}" onclick="setActiveTab('calendar')">📅 Calendário</button>
                        <button class="tab ${state.activeTab === 'profile' ? 'active' : ''}" onclick="setActiveTab('profile')">👤 Meu Perfil</button>
                    </div>
                    
                    <!-- Dashboard Tab -->
                    <div class="tab-content ${state.activeTab === 'dashboard' ? 'active' : ''}">
                        ${state.selectedEvent && currentEvent ? `
                            <div class="stats-grid">
                                <div class="stat-card"><h3>📅 Eventos</h3><div class="stat-number">${state.events.length}</div></div>
                                <div class="stat-card"><h3>👥 Convidados</h3><div class="stat-number">${state.guests.length}</div></div>
                                <div class="stat-card"><h3>🏢 Fornecedores</h3><div class="stat-number">${state.suppliers.length}</div></div>
                                <div class="stat-card"><h3>✅ Tarefas</h3><div class="stat-number">${state.tasks.filter(t => t.completed).length}/${state.tasks.length}</div></div>
                            </div>
                            
                            <div class="budget-grid">
                                <div class="budget-card used">
                                    <h3>💰 Utilizado</h3>
                                    <div class="budget-value">${formatCurrency(totalGasto)}</div>
                                    <small style="color: #888;">${percentual.toFixed(1)}% do total</small>
                                </div>
                                <div class="budget-card available">
                                    <h3>💵 Disponível</h3>
                                    <div class="budget-value">${formatCurrency(orcamentoTotal - totalGasto)}</div>
                                    <small style="color: #888;">${(100 - percentual).toFixed(1)}% restante</small>
                                </div>
                            </div>
                            
                            <div class="progress-section">
                                <h3>📊 Progresso do Orçamento: ${percentual.toFixed(1)}%</h3>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${percentual}%"></div></div>
                                <h3 style="margin-top: 0.5rem">✅ Checklist: ${progressoChecklist.toFixed(0)}%</h3>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${progressoChecklist}%"></div></div>
                            </div>
                            
                            <div class="charts-grid">
                                <div class="chart-card"><h3>📊 Gastos por Categoria</h3><div class="chart-container"><canvas id="graficoBarras"></canvas></div></div>
                                <div class="chart-card"><h3>🥧 Status dos Convidados</h3><div class="chart-container"><canvas id="graficoPizza"></canvas></div></div>
                            </div>
                        ` : `
                            <div class="empty-state">
                                <p>📌 Selecione um evento para ver o dashboard completo!</p>
                                <button class="btn" onclick="setActiveTab('events')" style="margin-top: 1rem;">Ver meus eventos</button>
                            </div>
                        `}
                    </div>
                    
                    <!-- Checklist Tab -->
                    <div class="tab-content ${state.activeTab === 'checklist' ? 'active' : ''}">
                        ${renderChecklist()}
                    </div>
                    
                    <!-- Events Tab -->
                    <div class="tab-content ${state.activeTab === 'events' ? 'active' : ''}">
                        <div class="section-header">
                            <h2>🎯 Meus Eventos</h2>
                            <button class="btn" onclick="openEventModal()">+ Novo Evento</button>
                        </div>
                        
                        ${state.events.length === 0 ? `
                            <div class="empty-state"><p>Nenhum evento. Crie seu primeiro evento!</p></div>
                        ` : `
                            <div class="events-grid">
                                ${state.events.map(event => {
                                    const gastosEvento = globalSuppliers.filter(s => s.event_id === event.id).reduce((s, i) => s + (i.value || 0), 0);
                                    const perc = event.budget_total ? (gastosEvento / event.budget_total) * 100 : 0;
                                    return `
                                        <div class="event-card ${state.selectedEvent === event.id ? 'selected' : ''}" onclick="selectEvent(${event.id})">
                                            <div class="event-card-header"><h4>${event.name || event.couple_names || 'Evento'}</h4></div>
                                            <div class="event-card-body">

                                                <p><strong>💰 Orçamento:</strong> ${formatCurrency(event.budget_total)}</p>
                                                <p><strong>💸 Gasto:</strong> ${formatCurrency(gastosEvento)} (${perc.toFixed(0)}%)</p>
                                                <p><strong>📅 Data:</strong> ${formatDate(event.event_date)}</p>
                                            </div>
                                            <div style="padding: 0 0.75rem 0.75rem; display: flex; gap: 0.5rem;">
                                                <button class="btn-secondary" style="flex:1" onclick="event.stopPropagation(); editEvent(${event.id})">✏️ Editar</button>
                                                <button class="btn-secondary" style="flex:1" onclick="event.stopPropagation(); deleteEventConfirm(${event.id})">🗑️ Excluir</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                        
                        ${state.selectedEvent && currentEvent ? `
                            <div>
                                <div class="section-header"><h2>🎉 Gerenciando: ${currentEvent.name || currentEvent.couple_names || 'Evento'}</h2>
                                <button class="btn-secondary" onclick="selectEvent(null)">Trocar Evento</button></div>
                                
                                <div class="section-header"><h2>👥 Convidados</h2><button class="btn" onclick="openGuestModal()">+ Adicionar Convidado</button></div>
                                <div class="guest-list">
                                    ${state.guests.map(g => `
                                        <div class="guest-card">
                                            <div><strong>${g.name}</strong><div style="font-size:0.7rem; color:#888;">${g.status === 'confirmado' ? '✅ Confirmado' : g.status === 'recusado' ? '❌ Recusado' : '⏳ Pendente'}${g.table_name ? ` • Mesa ${g.table_name}` : ''}</div></div>
                                            <div><button class="btn-icon" onclick="editGuest(${g.id})">✏️</button><button class="btn-icon" onclick="deleteGuestConfirm(${g.id})">🗑️</button></div>
                                        </div>
                                    `).join('')}
                                    ${state.guests.length === 0 ? '<div class="empty-state">Nenhum convidado cadastrado</div>' : ''}
                                </div>
                                
                                <div class="section-header"><h2>🏢 Fornecedores</h2><button class="btn" onclick="openSupplierModal()">+ Adicionar Fornecedor</button></div>
                                <div class="supplier-list">
                                    ${state.suppliers.map(s => `
                                        <div class="supplier-card">
                                            <div><strong>${s.name}</strong><div style="font-size:0.7rem; color:#888;">📂 ${s.category} • 💰 ${formatCurrency(s.value)}<br>${s.status === 'contratado' ? '✅ Contratado' : s.status === 'negociacao' ? '🤝 Negociação' : '📄 Cotado'}</div></div>
                                            <div><button class="btn-icon" onclick="editSupplier(${s.id})">✏️</button><button class="btn-icon" onclick="deleteSupplierConfirm(${s.id})">🗑️</button></div>
                                        </div>
                                    `).join('')}
                                    ${state.suppliers.length === 0 ? '<div class="empty-state">Nenhum fornecedor cadastrado</div>' : ''}
                                </div>
                            </div>
                        ` : state.events.length > 0 ? `
                            <div class="empty-state"><p>Clique em um evento para gerenciar convidados e fornecedores</p></div>
                        ` : ''}
                    </div>
                    
                    <!-- Calendar Tab -->
                    <div class="tab-content ${state.activeTab === 'calendar' ? 'active' : ''}">
                        ${calendarioHtml}
                    </div>
                    
                    <!-- Profile Tab -->
                    <div class="tab-content ${state.activeTab === 'profile' ? 'active' : ''}">
                        ${renderPerfil()}
                    </div>
                </div>
                
                ${modalHtml}
            `;
            
            criarGraficos();
            
            // Eventos dos formulários
            const profileForm = document.getElementById('profileForm');
            if (profileForm) {
                profileForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const data = Object.fromEntries(formData.entries());
                    updateProfile(data);
                });
            }
            
            const photoUpload = document.getElementById('photoUpload');
            if (photoUpload) {
                photoUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            updateProfilePhoto(event.target.result);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
            
            if (state.showEventForm) document.getElementById('eventForm')?.addEventListener('submit', handleEventSubmit);
            if (state.showGuestForm) document.getElementById('guestForm')?.addEventListener('submit', handleGuestSubmit);
            if (state.showSupplierForm) document.getElementById('supplierForm')?.addEventListener('submit', handleSupplierSubmit);
            if (state.showTaskForm) document.getElementById('taskForm')?.addEventListener('submit', handleTaskSubmit);
        }
        
        // ============================================
        // FORMULÁRIOS
        // ============================================
        
        function renderEventForm() {
            const event = state.editingEvent;
            return `
                <div class="modal" id="eventModal"><div class="modal-content">
                    <h2>${event ? 'Editar Evento' : 'Novo Evento'}</h2>
                    <form id="eventForm">
                        <div class="form-group"><label>Nome do Evento</label><input type="text" name="name" value="${event?.name || ''}"></div>
                        <div class="form-group"><label>Nomes dos Noivos</label><input type="text" name="couple_names" value="${event?.couple_names || ''}"></div>
                        <div class="form-group"><label>Tipo</label><select name="event_type"><option>Casamento</option><option>Corporativo</option><option>Aniversário</option><option>Festa</option></select></div>
                        <div class="form-group"><label>Tema</label><select name="theme"><option>Clássico</option><option>Moderno</option><option>Rústico</option><option>Luxo</option></select></div>
                        <div class="form-group"><label>Orçamento (R$)</label><input type="number" name="budget_total" value="${event?.budget_total || ''}"></div>
                        <div class="form-group"><label>Data</label><input type="date" name="event_date" value="${event?.event_date || ''}"></div>
                        <div class="form-group"><label>Local</label><input type="text" name="venue" value="${event?.venue || ''}"></div>
                        <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;"><button type="submit" class="btn">Salvar</button><button type="button" class="btn-secondary" onclick="closeEventModal()">Cancelar</button></div>
                    </form>
                </div></div>
            `;
        }
        
        function renderGuestForm() {
            const guest = state.editingGuest;
            return `
                <div class="modal" id="guestModal"><div class="modal-content">
                    <h2>${guest ? 'Editar Convidado' : 'Novo Convidado'}</h2>
                    <form id="guestForm">
                        <div class="form-group"><label>Nome do Convidado *</label><input type="text" name="name" value="${guest?.name || ''}" required></div>
                        <div class="form-group"><label>Grupo/Família</label><input type="text" name="group_name" value="${guest?.group_name || ''}"></div>
                        <div class="form-group"><label>Status</label><select name="status"><option>pendente</option><option>confirmado</option><option>recusado</option></select></div>
                        <div class="form-group"><label>Número da Mesa</label><input type="text" name="table_name" value="${guest?.table_name || ''}"></div>
                        <div class="form-group"><label>Telefone</label><input type="text" name="phone" value="${guest?.phone || ''}"></div>
                        <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;"><button type="submit" class="btn">Salvar</button><button type="button" class="btn-secondary" onclick="closeGuestModal()">Cancelar</button></div>
                    </form>
                </div></div>
            `;
        }
        
        function renderSupplierForm() {
            const supplier = state.editingSupplier;
            return `
                <div class="modal" id="supplierModal"><div class="modal-content">
                    <h2>${supplier ? 'Editar Fornecedor' : 'Novo Fornecedor'}</h2>
                    <form id="supplierForm">
                        <div class="form-group"><label>Nome do Fornecedor *</label><input type="text" name="name" value="${supplier?.name || ''}" required></div>
                        <div class="form-group"><label>Categoria</label><select name="category"><option>Buffet</option><option>Fotografia</option><option>Música</option><option>Decoração</option><option>Espaço</option><option>Vestuário</option><option>Outro</option></select></div>
                        <div class="form-group"><label>Status</label><select name="status"><option>cotado</option><option>negociacao</option><option>contratado</option></select></div>
                        <div class="form-group"><label>Valor (R$)</label><input type="number" name="value" value="${supplier?.value || 0}"></div>
                        <div class="form-group"><label>Contato</label><input type="text" name="contact" value="${supplier?.contact || ''}"></div>
                        <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;"><button type="submit" class="btn">Salvar</button><button type="button" class="btn-secondary" onclick="closeSupplierModal()">Cancelar</button></div>
                    </form>
                </div></div>
            `;
        }
        
        function renderTaskForm() {
            const task = state.editingTask;
            return `
                <div class="modal" id="taskModal"><div class="modal-content">
                    <h2>${task ? 'Editar Tarefa' : 'Nova Tarefa'}</h2>
                    <form id="taskForm">
                        <div class="form-group"><label>Nome da Tarefa *</label><input type="text" name="name" value="${task?.name || ''}" required></div>
                        <div class="form-group"><label>Categoria</label><select name="category"><option>12 meses</option><option>9 meses</option><option>6 meses</option><option>3 meses</option><option>1 mês</option><option>1 semana</option><option>Dia do Casamento</option></select></div>
                        <div class="form-group"><label>Prioridade</label><select name="priority"><option>baixa</option><option>media</option><option>alta</option></select></div>
                        <div class="form-group"><label>Data Limite</label><input type="date" name="due_date" value="${task?.due_date || ''}"></div>
                        <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;"><button type="submit" class="btn">Salvar</button><button type="button" class="btn-secondary" onclick="closeTaskModal()">Cancelar</button></div>
                    </form>
                </div></div>
            `;
        }
        
        function renderAuth() {
            const app = document.getElementById('app');
            const isLogin = state.authMode === 'login';
            
            app.innerHTML = `
                <div class="auth-container"><div class="auth-box">
                    <h1>💍 La Vie Casamentos</h1>
                    <div class="auth-tabs"><button class="auth-tab ${isLogin ? 'active' : ''}" onclick="setAuthMode('login')">Login</button><button class="auth-tab ${!isLogin ? 'active' : ''}" onclick="setAuthMode('register')">Cadastrar</button></div>
                    <div id="authMessage" class="error-message" style="display:none"></div>
                    ${isLogin ? `
                        <form id="loginForm"><div class="form-group"><label>Usuário</label><input type="text" id="loginUsername" required></div>
                        <div class="form-group"><label>Senha</label><input type="password" id="loginPassword" required></div>
                        <button type="submit" class="btn" style="width:100%">Entrar</button></form>
                    ` : `
                        <form id="registerForm"><div class="form-group"><label>Usuário</label><input type="text" id="regUsername" required></div>
                        <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
                        <div class="form-group"><label>Senha</label><input type="password" id="regPassword" required></div>
                        <div class="form-group"><label>Confirmar Senha</label><input type="password" id="regConfirmPassword" required></div>
                        <button type="submit" class="btn" style="width:100%">Cadastrar</button></form>
                    `}
                </div></div>
            `;
            
            if (isLogin) {
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('loginUsername').value;
                    const password = document.getElementById('loginPassword').value;
                    if (login(username, password)) renderDashboard();
                    else { const msg = document.getElementById('authMessage'); msg.style.display = 'block'; msg.textContent = 'Usuário ou senha inválidos!'; }
                });
            } else {
                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('regUsername').value;
                    const email = document.getElementById('regEmail').value;
                    const password = document.getElementById('regPassword').value;
                    const confirm = document.getElementById('regConfirmPassword').value;
                    const msg = document.getElementById('authMessage');
                    if (password !== confirm) { msg.style.display = 'block'; msg.textContent = 'Senhas não coincidem!'; return; }
                    if (password.length < 4) { msg.style.display = 'block'; msg.textContent = 'Mínimo 4 caracteres!'; return; }
                    const result = register(username, password, email);
                    if (result.success) {
                        msg.style.display = 'block'; msg.className = 'success-message'; msg.textContent = 'Cadastro realizado! Faça login.';
                        setTimeout(() => { state.authMode = 'login'; renderAuth(); }, 2000);
                    } else { msg.style.display = 'block'; msg.textContent = result.error; }
                });
            }
        }
        
        // ============================================
        // HANDLERS
        // ============================================
        
        async function handleEventSubmit(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.budget_total = parseFloat(data.budget_total || 0);
            (state.editingEvent ? updateEvent(state.editingEvent.id, data) : createEvent(data)) ? (closeEventModal(), renderDashboard()) : alert('Erro');
        }
        
        async function handleGuestSubmit(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.event_id = state.selectedEvent;
            (state.editingGuest ? updateGuest(state.editingGuest.id, data) : createGuest(data)) ? (closeGuestModal(), renderDashboard()) : alert('Erro');
        }
        
        async function handleSupplierSubmit(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.event_id = state.selectedEvent;
            data.value = parseFloat(data.value || 0);
            (state.editingSupplier ? updateSupplier(state.editingSupplier.id, data) : createSupplier(data)) ? (closeSupplierModal(), renderDashboard()) : alert('Erro');
        }
        
        async function handleTaskSubmit(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            if (state.editingTask) updateTask(state.editingTask.id, data);
            else createTask({ ...data, event_id: state.selectedEvent || null });
            closeTaskModal();
            renderDashboard();
        }
        
        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        
        window.setAuthMode = (m) => { state.authMode = m; renderAuth(); };
        window.setActiveTab = (tab) => { state.activeTab = tab; renderDashboard(); };
        window.setTaskFilter = (filter) => { state.taskFilter = filter; renderDashboard(); };
        window.selectEvent = (id) => { state.selectedEvent = id; loadEventData(id); renderDashboard(); };
        window.mudarMes = (d) => { const nd = new Date(state.calendarYear, state.calendarMonth + d, 1); state.calendarYear = nd.getFullYear(); state.calendarMonth = nd.getMonth(); renderDashboard(); };
        window.selecionarDataCalendario = (dataISO) => {
            const data = new Date(dataISO);
            const evento = state.events.find(e => new Date(e.event_date).toDateString() === data.toDateString());
            if (evento) { state.selectedEvent = evento.id; loadEventData(evento.id); setActiveTab('dashboard'); }
            else alert(`Nenhum evento em ${data.toLocaleDateString('pt-BR')}`);
        };
        window.toggleTaskComplete = (id) => { toggleTaskComplete(id); renderDashboard(); };
        
        window.openEventModal = () => { state.editingEvent = null; state.showEventForm = true; renderDashboard(); };
        window.editEvent = (id) => { state.editingEvent = state.events.find(e => e.id === id); state.showEventForm = true; renderDashboard(); };
        window.closeEventModal = () => { state.showEventForm = false; state.editingEvent = null; renderDashboard(); };
        window.deleteEventConfirm = (id) => { if (confirm('Excluir evento?')) deleteEvent(id) && renderDashboard(); };
        
        window.openGuestModal = () => { if (!state.selectedEvent) { alert('Selecione um evento primeiro!'); return; } state.editingGuest = null; state.showGuestForm = true; renderDashboard(); };
        window.editGuest = (id) => { state.editingGuest = state.guests.find(g => g.id === id); state.showGuestForm = true; renderDashboard(); };
        window.closeGuestModal = () => { state.showGuestForm = false; state.editingGuest = null; renderDashboard(); };
        window.deleteGuestConfirm = (id) => { if (confirm('Excluir convidado?')) deleteGuest(id) && renderDashboard(); };
        
        window.openSupplierModal = () => { if (!state.selectedEvent) { alert('Selecione um evento primeiro!'); return; } state.editingSupplier = null; state.showSupplierForm = true; renderDashboard(); };
        window.editSupplier = (id) => { state.editingSupplier = state.suppliers.find(s => s.id === id); state.showSupplierForm = true; renderDashboard(); };
        window.closeSupplierModal = () => { state.showSupplierForm = false; state.editingSupplier = null; renderDashboard(); };
        window.deleteSupplierConfirm = (id) => { if (confirm('Excluir fornecedor?')) deleteSupplier(id) && renderDashboard(); };
        
        window.openTaskModal = () => { state.editingTask = null; state.showTaskForm = true; renderDashboard(); };
        window.editTask = (id) => { state.editingTask = state.tasks.find(t => t.id === id); state.showTaskForm = true; renderDashboard(); };
        window.closeTaskModal = () => { state.showTaskForm = false; state.editingTask = null; renderDashboard(); };
        window.deleteTaskConfirm = (id) => { if (confirm('Excluir tarefa?')) deleteTask(id) && renderDashboard(); };
        
        window.logout = logout;
        
        function init() { renderAuth(); }
        init();
    </script>
</body>
</html>
