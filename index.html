<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vie Casamentos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #e11d48, #9f1239);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e11d48;
            font-weight: bold;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Grids */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #e11d48;
        }

        .countdown-card {
            background: linear-gradient(135deg, #e11d48, #9f1239);
            color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            text-align: center;
        }

        .countdown-digits {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .countdown-digit {
            background: rgba(255,255,255,0.2);
            padding: 0.5rem;
            border-radius: 0.5rem;
            min-width: 60px;
        }

        .countdown-digit span {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .chart-card h3 {
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .chart-container {
            position: relative;
            height: 250px;
        }

        .full-width-chart {
            grid-column: span 2;
        }

        /* Progresso */
        .progress-section {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }

        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #e11d48, #9f1239);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 0.75rem;
        }

        /* Cards de Orçamento */
        .budget-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .budget-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .budget-card.used {
            border-left: 4px solid #e11d48;
        }

        .budget-card.available {
            border-left: 4px solid #10b981;
        }

        .budget-card h3 {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .budget-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }

        .budget-card.used .budget-value {
            color: #e11d48;
        }

        .budget-card.available .budget-value {
            color: #10b981;
        }

        .budget-percent {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .budget-percent.warning {
            color: #f59e0b;
        }

        .budget-percent.danger {
            color: #dc2626;
        }

        .budget-percent.success {
            color: #10b981;
        }

        /* Calendário */
        .calendar-section {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-nav {
            display: flex;
            gap: 0.5rem;
        }

        .calendar-nav button {
            background: #f1f5f9;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .calendar-weekday {
            text-align: center;
            font-weight: bold;
            padding: 0.5rem;
            color: #64748b;
        }

        .calendar-day {
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            background: #f1f5f9;
        }

        .calendar-day.has-event {
            background: #e11d48;
            color: white;
        }

        .calendar-day.today {
            border: 2px solid #e11d48;
        }

        .event-indicator {
            font-size: 0.7rem;
            margin-top: 0.25rem;
        }

        /* Seções */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1rem;
        }

        .btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .event-card:hover {
            transform: translateY(-4px);
        }

        .event-card.selected {
            border: 2px solid #e11d48;
        }

        .event-card-header {
            background: linear-gradient(135deg, #e11d48, #9f1239);
            color: white;
            padding: 1rem;
        }

        .event-card-body {
            padding: 1rem;
        }

        .event-card-body p {
            margin: 0.5rem 0;
            color: #475569;
            font-size: 0.875rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e11d48, #9f1239);
        }

        .auth-box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .auth-box h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #e11d48;
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 600;
            color: #64748b;
        }

        .auth-tab.active {
            color: #e11d48;
            border-bottom: 2px solid #e11d48;
            margin-bottom: -2px;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 1rem;
            color: #64748b;
        }

        .guest-list, .supplier-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .guest-card, .supplier-card {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 0.5rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid, .charts-grid, .budget-cards {
                grid-template-columns: 1fr;
            }
            .full-width-chart {
                grid-column: span 1;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================
        // SISTEMA COMPLETO COM ORÇAMENTO DETALHADO
        // ============================================
        
        // Banco de dados local
        let USUARIOS = JSON.parse(localStorage.getItem('usuarios')) || {};
        let globalEvents = JSON.parse(localStorage.getItem('globalEvents')) || [];
        let globalGuests = JSON.parse(localStorage.getItem('globalGuests')) || [];
        let globalSuppliers = JSON.parse(localStorage.getItem('globalSuppliers')) || [];
        let globalExpenses = JSON.parse(localStorage.getItem('globalExpenses')) || [];
        let nextIds = JSON.parse(localStorage.getItem('nextIds')) || { event: 1, guest: 1, supplier: 1, expense: 1 };

        // Criar admin automaticamente
        if (!USUARIOS['admin']) {
            USUARIOS['admin'] = {
                id: 1,
                username: 'admin',
                password: 'admin123',
                email: 'admin@lavie.com',
                is_admin: true,
                created_at: new Date().toISOString()
            };
            localStorage.setItem('usuarios', JSON.stringify(USUARIOS));
        }

        // Estado da aplicação
        let state = {
            user: null,
            events: [],
            guests: [],
            suppliers: [],
            expenses: [],
            selectedEvent: null,
            showEventForm: false,
            showGuestForm: false,
            showSupplierForm: false,
            showExpenseForm: false,
            editingEvent: null,
            editingGuest: null,
            editingSupplier: null,
            editingExpense: null,
            authMode: 'login',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            charts: {}
        };

        // Salvar dados
        function salvarDados() {
            localStorage.setItem('usuarios', JSON.stringify(USUARIOS));
            localStorage.setItem('globalEvents', JSON.stringify(globalEvents));
            localStorage.setItem('globalGuests', JSON.stringify(globalGuests));
            localStorage.setItem('globalSuppliers', JSON.stringify(globalSuppliers));
            localStorage.setItem('globalExpenses', JSON.stringify(globalExpenses));
            localStorage.setItem('nextIds', JSON.stringify(nextIds));
        }

        // ============================================
        // FUNÇÕES DE AUTENTICAÇÃO
        // ============================================
        
        function register(username, password, email) {
            if (USUARIOS[username]) {
                return { success: false, error: 'Usuário já existe!' };
            }
            
            const emailExistente = Object.values(USUARIOS).some(u => u.email === email);
            if (emailExistente) {
                return { success: false, error: 'Email já cadastrado!' };
            }
            
            const novoId = Object.keys(USUARIOS).length + 1;
            USUARIOS[username] = {
                id: novoId,
                username: username,
                password: password,
                email: email,
                is_admin: false,
                created_at: new Date().toISOString()
            };
            
            salvarDados();
            return { success: true };
        }
        
        function login(username, password) {
            const user = USUARIOS[username];
            
            if (user && user.password === password) {
                state.user = { ...user };
                state.events = globalEvents.filter(e => e.user_id === user.id);
                state.selectedEvent = null;
                state.guests = [];
                state.suppliers = [];
                state.expenses = [];
                return true;
            }
            return false;
        }
        
        function logout() {
            state.user = null;
            state.events = [];
            state.selectedEvent = null;
            state.guests = [];
            state.suppliers = [];
            state.expenses = [];
            Object.values(state.charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            renderAuth();
        }
        
        // ============================================
        // CRUD DE EVENTOS
        // ============================================
        
        function createEvent(eventData) {
            const newEvent = {
                id: nextIds.event++,
                user_id: state.user.id,
                ...eventData,
                created_at: new Date().toISOString()
            };
            globalEvents.push(newEvent);
            state.events.push(newEvent);
            salvarDados();
            return true;
        }
        
        function updateEvent(id, eventData) {
            const index = globalEvents.findIndex(e => e.id === id);
            if (index !== -1) {
                globalEvents[index] = { ...globalEvents[index], ...eventData };
                const userIndex = state.events.findIndex(e => e.id === id);
                if (userIndex !== -1) {
                    state.events[userIndex] = { ...state.events[userIndex], ...eventData };
                }
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteEvent(id) {
            const index = globalEvents.findIndex(e => e.id === id);
            if (index !== -1) {
                globalEvents.splice(index, 1);
                state.events = state.events.filter(e => e.id !== id);
                
                globalGuests = globalGuests.filter(g => g.event_id !== id);
                globalSuppliers = globalSuppliers.filter(s => s.event_id !== id);
                globalExpenses = globalExpenses.filter(e => e.event_id !== id);
                
                if (state.selectedEvent === id) {
                    state.selectedEvent = null;
                    state.guests = [];
                    state.suppliers = [];
                    state.expenses = [];
                }
                salvarDados();
                return true;
            }
            return false;
        }
        
        // ============================================
        // CRUD DE CONVIDADOS
        // ============================================
        
        function createGuest(guestData) {
            const newGuest = {
                id: nextIds.guest++,
                ...guestData
            };
            globalGuests.push(newGuest);
            if (newGuest.event_id === state.selectedEvent) {
                state.guests.push(newGuest);
            }
            salvarDados();
            return true;
        }
        
        function updateGuest(id, guestData) {
            const index = globalGuests.findIndex(g => g.id === id);
            if (index !== -1) {
                globalGuests[index] = { ...globalGuests[index], ...guestData };
                const userIndex = state.guests.findIndex(g => g.id === id);
                if (userIndex !== -1) {
                    state.guests[userIndex] = { ...state.guests[userIndex], ...guestData };
                }
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteGuest(id) {
            const index = globalGuests.findIndex(g => g.id === id);
            if (index !== -1) {
                globalGuests.splice(index, 1);
                state.guests = state.guests.filter(g => g.id !== id);
                salvarDados();
                return true;
            }
            return false;
        }
        
        // ============================================
        // CRUD DE FORNECEDORES
        // ============================================
        
        function createSupplier(supplierData) {
            const newSupplier = {
                id: nextIds.supplier++,
                ...supplierData,
                created_at: new Date().toISOString()
            };
            globalSuppliers.push(newSupplier);
            if (newSupplier.event_id === state.selectedEvent) {
                state.suppliers.push(newSupplier);
            }
            salvarDados();
            return true;
        }
        
        function updateSupplier(id, supplierData) {
            const index = globalSuppliers.findIndex(s => s.id === id);
            if (index !== -1) {
                globalSuppliers[index] = { ...globalSuppliers[index], ...supplierData };
                const userIndex = state.suppliers.findIndex(s => s.id === id);
                if (userIndex !== -1) {
                    state.suppliers[userIndex] = { ...state.suppliers[userIndex], ...supplierData };
                }
                salvarDados();
                return true;
            }
            return false;
        }
        
        function deleteSupplier(id) {
            const index = globalSuppliers.findIndex(s => s.id === id);
            if (index !== -1) {
                globalSuppliers.splice(index, 1);
                state.suppliers = state.suppliers.filter(s => s.id !== id);
                salvarDados();
                return true;
            }
            return false;
        }
        
        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value || 0);
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'Não definida';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }
        
        function loadEventData(eventId) {
            state.guests = globalGuests.filter(g => g.event_id === eventId);
            state.suppliers = globalSuppliers.filter(s => s.event_id === eventId);
            state.expenses = globalExpenses.filter(e => e.event_id === eventId);
        }
        
        function getDiasRestantes(eventDate) {
            if (!eventDate) return null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const evento = new Date(eventDate);
            evento.setHours(0, 0, 0, 0);
            const diffTime = evento - hoje;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }
        
        function calcularProgresso(evento) {
            if (!evento || !evento.budget_total || evento.budget_total === 0) return 0;
            const suppliersTotal = state.suppliers.reduce((sum, s) => sum + (s.value || 0), 0);
            const percentual = (suppliersTotal / evento.budget_total) * 100;
            return Math.min(percentual, 100);
        }
        
        function getTotalGasto() {
            return state.suppliers.reduce((sum, s) => sum + (s.value || 0), 0);
        }
        
        function getOrcamentoRestante(evento) {
            if (!evento || !evento.budget_total) return 0;
            const totalGasto = getTotalGasto();
            return Math.max(0, evento.budget_total - totalGasto);
        }
        
        function getPercentualUtilizado(evento) {
            if (!evento || !evento.budget_total || evento.budget_total === 0) return 0;
            const totalGasto = getTotalGasto();
            const percentual = (totalGasto / evento.budget_total) * 100;
            return Math.min(percentual, 100);
        }
        
        function getStatusCorPercentual(percentual) {
            if (percentual >= 90) return 'danger';
            if (percentual >= 70) return 'warning';
            return 'success';
        }
        
        function getGastosPorCategoria() {
            const categorias = {};
            state.suppliers.forEach(supplier => {
                const cat = supplier.category || 'Outros';
                categorias[cat] = (categorias[cat] || 0) + (supplier.value || 0);
            });
            return categorias;
        }
        
        function getStatusConvidados() {
            const status = { confirmado: 0, pendente: 0, recusado: 0 };
            state.guests.forEach(guest => {
                if (guest.status === 'confirmado') status.confirmado++;
                else if (guest.status === 'recusado') status.recusado++;
                else status.pendente++;
            });
            return status;
        }
        
        function getEvolucaoOrcamento() {
            const meses = {};
            const hoje = new Date();
            
            for (let i = 5; i >= 0; i--) {
                const data = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
                const key = `${data.getMonth() + 1}/${data.getFullYear()}`;
                meses[key] = 0;
            }
            
            state.suppliers.forEach(supplier => {
                if (supplier.created_at) {
                    const date = new Date(supplier.created_at);
                    const key = `${date.getMonth() + 1}/${date.getFullYear()}`;
                    if (meses[key] !== undefined) {
                        meses[key] += supplier.value || 0;
                    }
                }
            });
            
            let acumulado = 0;
            const labels = [];
            const valores = [];
            Object.entries(meses).forEach(([mes, valor]) => {
                acumulado += valor;
                labels.push(mes);
                valores.push(acumulado);
            });
            
            return { labels, valores };
        }
        
        // ============================================
        // GRÁFICOS
        // ============================================
        
        function criarGraficoBarras() {
            const ctx = document.getElementById('graficoBarras')?.getContext('2d');
            if (!ctx) return;
            if (state.charts.barras) state.charts.barras.destroy();
            
            const gastos = getGastosPorCategoria();
            
            state.charts.barras = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(gastos),
                    datasets: [{

                        borderRadius: 8

                        tooltip: { callbacks: { label: (ctx) => formatCurrency(ctx.raw) } }

        function criarGraficoPizza() {
            const ctx = document.getElementById('graficoPizza')?.getContext('2d');
            if (!ctx) return;
            if (state.charts.pizza) state.charts.pizza.destroy();
            
            const status = getStatusConvidados();
            const total = state.guests.length;
            
            state.charts.pizza = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [`Confirmados (${status.confirmado})`, `Pendentes (${status.pendente})`, `Recusados (${status.recusado})`],
                    datasets: [{
                        data: [status.confirmado, status.pendente, status.recusado],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.raw} convidados (${((ctx.raw / total) * 100).toFixed(1)}%)` } }
                    }
                }
            });
        }
        
        function criarGraficoLinha() {
            const ctx = document.getElementById('graficoLinha')?.getContext('2d');
            if (!ctx) return;
            if (state.charts.linha) state.charts.linha.destroy();
            
            const evolucao = getEvolucaoOrcamento();
            
            state.charts.linha = new Chart(ctx, {

                    datasets: [{

        // ============================================
        // CALENDÁRIO
        // ============================================
        
        function renderizarCalendario() {
            const primeiraSemana = new Date(state.calendarYear, state.calendarMonth, 1);
            const ultimoDia = new Date(state.calendarYear, state.calendarMonth + 1, 0);
            const diasNoMes = ultimoDia.getDate();
            const primeiroDiaSemana = primeiraSemana.getDay();
            const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            let dias = [];
            
            for (let i = 0; i < primeiroDiaSemana; i++) dias.push(null);
            
            for (let i = 1; i <= diasNoMes; i++) {
                const dataAtual = new Date(state.calendarYear, state.calendarMonth, i);
                const temEvento = state.events.some(event => {
                    const dataEvento = new Date(event.event_date);
                    return dataEvento.toDateString() === dataAtual.toDateString();
                });
                const isToday = dataAtual.toDateString() === new Date().toDateString();
                dias.push({ dia: i, temEvento, isToday, data: dataAtual });
            }
            
            return `
                <div class="calendar-section">
                    <div class="calendar-header">
                        <h3>📅 ${primeiraSemana.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</h3>
                        <div class="calendar-nav">
                            <button onclick="mudarMes(-1)">◀</button>
                            <button onclick="mudarMes(1)">▶</button>
                        </div>
                    </div>
                    <div class="calendar-grid">
                        ${diasSemana.map(dia => `<div class="calendar-weekday">${dia.substring(0, 3)}</div>`).join('')}
                        ${dias.map(dia => dia === null ? 
                            '<div class="calendar-day"></div>' : 
                            `<div class="calendar-day ${dia.temEvento ? 'has-event' : ''} ${dia.isToday ? 'today' : ''}" onclick="selecionarDataCalendario('${dia.data.toISOString()}')">
                                ${dia.dia}
                                ${dia.temEvento ? '<div class="event-indicator">🎉</div>' : ''}
                            </div>`
                        ).join('')}
                    </div>
                </div>
            `;
        }
        
        function selecionarDataCalendario(dataISO) {
            const dataSelecionada = new Date(dataISO);
            const eventoNestaData = state.events.find(event => {
                const dataEvento = new Date(event.event_date);
                return dataEvento.toDateString() === dataSelecionada.toDateString();
            });
            
            if (eventoNestaData) {
                state.selectedEvent = eventoNestaData.id;
                loadEventData(eventoNestaData.id);
                renderDashboard();
            } else {
                alert(`Nenhum evento agendado para ${dataSelecionada.toLocaleDateString('pt-BR')}`);
            }
        }

                                    <option value="cotado" ${supplier?.status === 'cotado' ? 'selected' : ''}>Cotado</option>
                                    <option value="negociacao" ${supplier?.status === 'negociacao' ? 'selected' : ''}>Negociação</option>
                                    <option value="contratado" ${supplier?.status === 'contratado' ? 'selected' : ''}>Contratado</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Valor (R$)</label>
                                <input type="number" name="value" value="${supplier?.value || 0}" required>
                            </div>
                            <div class="form-group">
                                <label>Contato</label>
                                <input type="text" name="contact" value="${supplier?.contact || ''}">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn">Salvar Fornecedor</button>
                                <button type="button" class="btn btn-secondary" onclick="closeSupplierModal()">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }
        
        function renderAuth() {
            const app = document.getElementById('app');
            const isLogin = state.authMode === 'login';
            
            app.innerHTML = `
                <div class="auth-container">
                    <div class="auth-box">
                        <h1>💍 La Vie Casamentos</h1>
                        
                        <div class="auth-tabs">
                            <button class="auth-tab ${isLogin ? 'active' : ''}" onclick="setAuthMode('login')">Login</button>
                            <button class="auth-tab ${!isLogin ? 'active' : ''}" onclick="setAuthMode('register')">Cadastrar</button>
                        </div>
                        
                        <div id="authMessage" class="error-message" style="display: none;"></div>
                        
                        ${isLogin ? `
                            <form id="loginForm">
                                <div class="form-group">
                                    <label>Usuário</label>
                                    <input type="text" id="loginUsername" required>
                                </div>
                                <div class="form-group">
                                    <label>Senha</label>
                                    <input type="password" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn" style="width: 100%;">Entrar</button>
                            </form>
                        ` : `
                            <form id="registerForm">
                                <div class="form-group">
                                    <label>Usuário</label>
                                    <input type="text" id="regUsername" required>
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="regEmail" required>
                                </div>
                                <div class="form-group">
                                    <label>Senha</label>
                                    <input type="password" id="regPassword" required>
                                </div>
                                <div class="form-group">
                                    <label>Confirmar Senha</label>
                                    <input type="password" id="regConfirmPassword" required>
                                </div>
                                <button type="submit" class="btn" style="width: 100%;">Cadastrar</button>
                            </form>
                        `}
                    </div>
                </div>
            `;
            
            if (isLogin) {
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('loginUsername').value;
                    const password = document.getElementById('loginPassword').value;
                    const msgDiv = document.getElementById('authMessage');
                    
                    if (login(username, password)) {
                        renderDashboard();
                    } else {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = 'Usuário ou senha inválidos!';
                    }
                });
            } else {
                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('regUsername').value;
                    const email = document.getElementById('regEmail').value;
                    const password = document.getElementById('regPassword').value;
                    const confirmPassword = document.getElementById('regConfirmPassword').value;
                    const msgDiv = document.getElementById('authMessage');
                    
                    if (password !== confirmPassword) {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = 'As senhas não coincidem!';
                        return;
                    }
                    
                    if (password.length < 4) {
                        msgDiv.style.display = 'block';
                        msgDiv.textContent = 'A senha deve ter pelo menos 4 caracteres!';
                        return;
                    }
                    
                    const result = register(username, password, email);
                    if (result.success) {
                        msgDiv.style.display = 'block';
                        msgDiv.className = 'success-message';
                        msgDiv.textContent = 'Cadastro realizado com sucesso! Faça login.';
                        setTimeout(() => {
                            state.authMode = 'login';
                            renderAuth();
                        }, 2000);
                    } else {
                        msgDiv.style.display = 'block';
                        msgDiv.className = 'error-message';
                        msgDiv.textContent = result.error;
                    }
                });
            }
        }
        
        // ============================================
        // HANDLERS
        // ============================================
        
        async function handleEventSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.budget_total = parseFloat(data.budget_total || 0);
            
            let success;
            if (state.editingEvent) {
                success = updateEvent(state.editingEvent.id, data);
            } else {
                success = createEvent(data);
            }
            
            if (success) {
                closeEventModal();
                renderDashboard();
            } else {
                alert('Erro ao salvar evento');
            }
        }
        
        async function handleGuestSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.event_id = state.selectedEvent;
            
            let success;
            if (state.editingGuest) {
                success = updateGuest(state.editingGuest.id, data);
            } else {
                success = createGuest(data);
            }
            
            if (success) {
                closeGuestModal();
                renderDashboard();
            } else {
                alert('Erro ao salvar convidado');
            }
        }
        
        async function handleSupplierSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.event_id = state.selectedEvent;
            data.value = parseFloat(data.value || 0);
            data.created_at = new Date().toISOString();
            
            let success;
            if (state.editingSupplier) {
                success = updateSupplier(state.editingSupplier.id, data);
            } else {
                success = createSupplier(data);
            }
            
            if (success) {
                closeSupplierModal();
                renderDashboard();
            } else {
                alert('Erro ao salvar fornecedor');
            }
        }
        
        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        
        window.setAuthMode = (mode) => {
            state.authMode = mode;
            renderAuth();
        };
        
        window.selectEvent = (eventId) => {
            state.selectedEvent = eventId;
            loadEventData(eventId);
            renderDashboard();
        };
        
        window.mudarMes = (delta) => {
            const novaData = new Date(state.calendarYear, state.calendarMonth + delta, 1);
            state.calendarYear = novaData.getFullYear();
            state.calendarMonth = novaData.getMonth();
            renderDashboard();
        };
        
        window.selecionarDataCalendario = selecionarDataCalendario;
        
        window.openEventModal = () => {
            state.editingEvent = null;
            state.showEventForm = true;
            renderDashboard();
        };
        
        window.editEvent = (eventId) => {
            state.editingEvent = state.events.find(e => e.id === eventId);
            state.showEventForm = true;
            renderDashboard();
        };
        
        window.closeEventModal = () => {
            state.showEventForm = false;
            state.editingEvent = null;
            renderDashboard();
        };
        
        window.deleteEventConfirm = (eventId) => {
            if (confirm('Tem certeza que deseja excluir este evento?')) {
                deleteEvent(eventId);
                renderDashboard();
            }
        };
        
        window.openGuestModal = () => {
            if (!state.selectedEvent) {
                alert('Selecione um evento primeiro!');
                return;
            }
            state.editingGuest = null;
            state.showGuestForm = true;
            renderDashboard();
        };
        
        window.editGuest = (guestId) => {
            state.editingGuest = state.guests.find(g => g.id === guestId);
            state.showGuestForm = true;
            renderDashboard();
        };
        
        window.closeGuestModal = () => {
            state.showGuestForm = false;
            state.editingGuest = null;
            renderDashboard();
        };
        
        window.deleteGuestConfirm = (guestId) => {
            if (confirm('Tem certeza que deseja excluir este convidado?')) {
                deleteGuest(guestId);
                renderDashboard();
            }
        };
        
        window.openSupplierModal = () => {
            if (!state.selectedEvent) {
                alert('Selecione um evento primeiro!');
                return;
            }
            state.editingSupplier = null;
            state.showSupplierForm = true;
            renderDashboard();
        };
        
        window.editSupplier = (supplierId) => {
            state.editingSupplier = state.suppliers.find(s => s.id === supplierId);
            state.showSupplierForm = true;
            renderDashboard();
        };
        
        window.closeSupplierModal = () => {
            state.showSupplierForm = false;
            state.editingSupplier = null;
            renderDashboard();
        };
        
        window.deleteSupplierConfirm = (supplierId) => {
            if (confirm('Tem certeza que deseja excluir este fornecedor?')) {
                deleteSupplier(supplierId);
                renderDashboard();
            }
        };
        
        window.logout = logout;
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        
        function init() {
            renderAuth();
        }
        
        init();
    </script>
</body>
</html>
