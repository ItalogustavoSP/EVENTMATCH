<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#ffd700">
    <meta name="description" content="La Vie Casamentos - Plataforma completa para planejamento de casamentos">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <title>La Vie Casamentos - Plataforma de Eventos</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💛</text></svg>">
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
            }
        }
    </script>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- LOGOUT FIX - Carregar primeiro -->
    <script src="logout-fix.js"></script>
</head>
<body>
    <div id="app"></div>
    
    <script type="module" src="script.js"></script>
    
    <!-- Botão de emergência flutuante (caso o logout não funcione) -->
    <button id="emergencyLogoutBtn" style="position: fixed; bottom: 20px; right: 20px; background: #e11d48; color: white; border: none; border-radius: 50px; padding: 8px 16px; font-size: 12px; cursor: pointer; z-index: 9999; display: none;">
        ⚠️ Sair Emergência
    </button>
    
    <script>
        // Mostrar botão de emergência se o logout normal falhar
        setTimeout(() => {
            const emergencyBtn = document.getElementById('emergencyLogoutBtn');
            if (emergencyBtn && typeof window.forceLogout === 'function') {
                emergencyBtn.style.display = 'block';
                emergencyBtn.onclick = () => {
                    if (confirm('Logout de emergência. Tem certeza?')) {
                        window.forceLogout();
                    }
                };
            }
        }, 5000);
    </script>
</body>
</html>
