<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Presença - La Vie Casamentos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { color: #ffd700; margin-bottom: 1rem; }
        .loading { color: #ffd700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .loading::after { content: ''; width: 20px; height: 20px; border: 2px solid #ffd700; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #e11d48; }
        .success { color: #10b981; }
        .event-details {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: left;
        }
        .event-details p { margin: 0.5rem 0; color: #ccc; }
        .event-details strong { color: #ffd700; }
        .buttons { display: flex; gap: 1rem; margin: 1.5rem 0; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .btn-confirm { background: #10b981; color: white; }
        .btn-decline { background: #e11d48; color: white; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .footer { margin-top: 1rem; font-size: 0.7rem; color: #666; }
        .event-name { font-size: 1.2rem; color: #ffd700; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading">Carregando...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCTg35X3QhCeQCXZR_mfvdHufzyJycDAhg",
            authDomain: "la-vie-casamentos.firebaseapp.com",
            projectId: "la-vie-casamentos",
            storageBucket: "la-vie-casamentos.firebasestorage.app",
            messagingSenderId: "44479756816",
            appId: "1:44479756816:web:1fd88c199f3e782baae895"
        };

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                eventId: params.get('eventId'),
                guestId: params.get('guestId'),
                status: params.get('status')
            };
        }

        const { eventId, guestId, status } = getUrlParams();
        const contentDiv = document.getElementById('content');

        if (!eventId || !guestId) {
            contentDiv.innerHTML = `
                <h1>Link Inválido</h1>
                <p class="error">Não foi possível identificar o evento ou convidado.</p>
                <p>Entre em contato com os organizadores.</p>
                <div class="footer">La Vie Casamentos</div>
            `;
        } else {
            const script = document.createElement('script');
            script.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
            script.onload = () => {
                const firestoreScript = document.createElement('script');
                firestoreScript.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
                firestoreScript.onload = () => {
                    firebase.initializeApp(firebaseConfig);
                    const db = firebase.firestore();
                    loadData(db);
                };
                document.head.appendChild(firestoreScript);
            };
            document.head.appendChild(script);
        }

        async function loadData(db) {
            try {
                contentDiv.innerHTML = '<div class="loading">Carregando informações do evento...</div>';
                
                const eventDoc = await db.collection('events').doc(eventId).get();
                if (!eventDoc.exists()) {
                    contentDiv.innerHTML = '<h1>Evento não encontrado</h1><p class="error">Este evento não existe ou foi removido.</p>';
                    return;
                }
                const event = eventDoc.data();

                const guestDoc = await db.collection('guests').doc(guestId).get();
                if (!guestDoc.exists()) {
                    contentDiv.innerHTML = '<h1>Convidado não encontrado</h1><p class="error">Este convite não é válido.</p>';
                    return;
                }
                const guest = guestDoc.data();

                if (guest.status === 'confirmado') {
                    contentDiv.innerHTML = `
                        <h1>Presença Confirmada!</h1>
                        <p class="success">Obrigado por confirmar sua presença!</p>
                        <p>Aguardamos você com muito carinho!</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                    return;
                }
                
                if (guest.status === 'recusado') {
                    contentDiv.innerHTML = `
                        <h1>Presença Não Confirmada</h1>
                        <p class="success">Registramos sua resposta. Sentiremos sua falta!</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                    return;
                }

                if (status === 'confirmado') {
                    await db.collection('guests').doc(guestId).update({
                        status: 'confirmado',
                        responded_at: new Date().toISOString()
                    });
                    contentDiv.innerHTML = `
                        <h1>Presença Confirmada!</h1>
                        <p class="success">Obrigado! Aguardamos você com muito carinho! 🎊</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                    return;
                }
                
                if (status === 'recusado') {
                    await db.collection('guests').doc(guestId).update({
                        status: 'recusado',
                        responded_at: new Date().toISOString()
                    });
                    contentDiv.innerHTML = `
                        <h1>Presença Não Confirmada</h1>
                        <p class="success">Obrigado por nos avisar!</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                    return;
                }

                const eventName = event.name || event.couple_names || 'Evento';
                const eventDate = event.event_date ? new Date(event.event_date).toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) : 'Data a definir';
                const eventTime = event.event_time ? ` às ${event.event_time.substring(0,5)}` : '';
                const eventVenue = event.venue || 'Local a confirmar';
                
                contentDiv.innerHTML = `
                    <h1>Você foi convidado!</h1>
                    <div class="event-name">${eventName}</div>
                    <div class="event-details">
                        <p><strong>Data:</strong> ${eventDate}${eventTime}</p>
                        <p><strong>Local:</strong> ${eventVenue}</p>
                    </div>
                    <p>Por favor, confirme sua presença:</p>
                    <div class="buttons">
                        <button class="btn btn-confirm" id="confirmBtn">✅ Confirmar Presença</button>
                        <button class="btn btn-decline" id="declineBtn">❌ Não poderei comparecer</button>
                    </div>
                    <div class="footer">La Vie Casamentos - Transformando sonhos em realidade</div>
                `;

                document.getElementById('confirmBtn')?.addEventListener('click', async () => {
                    contentDiv.innerHTML = '<div class="loading">Processando...</div>';
                    await db.collection('guests').doc(guestId).update({
                        status: 'confirmado',
                        responded_at: new Date().toISOString()
                    });
                    contentDiv.innerHTML = `
                        <h1>Presença Confirmada!</h1>
                        <p class="success">Obrigado! Aguardamos você com muito carinho! 🎊</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                });
                
                document.getElementById('declineBtn')?.addEventListener('click', async () => {
                    contentDiv.innerHTML = '<div class="loading">Processando...</div>';
                    await db.collection('guests').doc(guestId).update({
                        status: 'recusado',
                        responded_at: new Date().toISOString()
                    });
                    contentDiv.innerHTML = `
                        <h1>Presença Não Confirmada</h1>
                        <p class="success">Obrigado por nos avisar!</p>
                        <div class="footer">La Vie Casamentos</div>
                    `;
                });

            } catch (error) {
                console.error('Erro:', error);
                contentDiv.innerHTML = `<h1>Erro</h1><p class="error">${error.message}</p><div class="footer">Tente novamente mais tarde</div>`;
            }
        }
    </script>
</body>
</html>
